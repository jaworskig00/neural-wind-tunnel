name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Fetch the published model artifacts
        # From the Releases, not the repository: generated artifacts are not committed (ADR-012).
        # The parity test and the end-to-end suite both need them present.
        run: uv run python tools/sync_models.py --release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Bundle size budget
        run: pnpm size

      - name: No credentials in the bundle, policy present
        run: pnpm check:bundle

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  model:
    name: Model artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Fetch the published model
        run: uv run python tools/sync_models.py --release
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Reference case reproduces
        # Holds both the ONNX graph and the raw weight blob to the committed reference outputs, and
        # bounds the predictions physically, so a numerically faithful but absurd model still fails.
        run: uv run python -m tools.train.check_artifact --models public/models

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest
